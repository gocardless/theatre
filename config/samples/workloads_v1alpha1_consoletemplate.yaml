# WARNING: this sample shows a deny-list shape. Do NOT use it as a model.
#
# The default rule requires 0 approvals and only `echo something-bad **` is gated.
# Rules match the console's command as exact strings, and the command is chosen by
# the user requesting the console. Any other spelling of the same operation (an
# absolute path to the binary, `sh -c`, `env`, ...) matches no rule, falls through
# to the default, and runs with no approval.
#
# Use a strict default with allowlist rules instead. See
# workloads_v1alpha1_consoletemplate_allowlist.yaml and the "Authorised consoles"
# section of internal/controller/workloads/README.md.
---
kind: ConsoleTemplate
apiVersion: workloads.crd.gocardless.com/v1alpha1
spec:
  additionalAttachSubjects:
    - kind: User
      name: foo@example.com
    - kind: User
      name: bar@example.com
  defaultTimeoutSeconds: 300
  maxTimeoutSeconds: 300
  defaultTtlSecondsAfterFinished: 30
  defaultTtlSecondsBeforeRunning: 120
  authorisationRules:
    - name: bad-command
      matchCommandElements: ["echo", "something-bad", "**"]
      authorisationsRequired: 1
      subjects:
        - kind: User
          name: bob@example.com
  defaultAuthorisationRule:
    subjects: []
    authorisationsRequired: 0
  template:
    spec:
      containers:
        - image: alpine:latest
          name: container-name-0
          command:
            - sleep
          args:
            - "100"
metadata:
  name: console-template-0
  labels:
    repo: myapp-owner-myapp-repo
    environment: myapp-env
